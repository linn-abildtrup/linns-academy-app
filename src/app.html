<!doctype html>
<html lang="da">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#B87B6E" />
		<!-- Slaar auto-oversaettelse fra: appen er paa dansk, og browser-
		     oversaettelser muterer DOM saa Svelte's reactivity bryder
		     (timer fryser, knapper holder op med at virke). -->
		<meta name="google" content="notranslate" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Linn's Academy" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Skrifterne hentes UDEN at blokere foerste optegning. Som almindeligt
		     stylesheet naegter browseren at tegne noget som helst foer Googles
		     server har svaret, og det er den eneste ting i hele appen der stadig
		     hentes udefra. Paa en doed mobilforbindelse blev det til en tom
		     skaerm i lang tid.
		     media="print" faar browseren til at hente filen uden at vente paa
		     den, og onload saetter den i brug saa snart den er hjemme. Teksten
		     tegnes i mellemtiden med reserve-skriften, praecis som display=swap
		     allerede goer i dag.
		     Skrifterne bruges kun af den gamle app. /ny har sine egne indlejret,
		     saa der var ventetiden ren spildtid. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>
		<noscript>
			<link
				href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=DM+Sans:wght@400;500;600;700&display=swap"
				rel="stylesheet"
			/>
		</noscript>
		<title>Linn's Academy</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
